name: BharatVoter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Opting into Node.js 24 as per GitHub's proactive warning to ensure a clean build
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x' # Using latest Node 24 for forward compatibility
    - run: npm install
    - run: npm test
      env:
        GOOGLE_API_KEY: "test_key_for_ci_passing"
        NODE_ENV: test
