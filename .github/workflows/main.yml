name: BharatVoter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x' # Using Node 22 (LTS) for the best balance
    - run: npm install
    - run: npm test
      env:
        GOOGLE_API_KEY: "test_key_for_ci_passing"
        NODE_ENV: test
