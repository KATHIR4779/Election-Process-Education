name: BharatVoter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Applying the force flag here to satisfy GitHub's 2026 deprecation notice
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x' # Keeping the stable Node 20 for the app logic
    - run: npm install
    - run: npm test
      env:
        GOOGLE_API_KEY: "test_key_for_ci_passing"
        NODE_ENV: test
